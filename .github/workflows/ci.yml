name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The agent core, governance layer, and the entire test suite are pure
      # standard library, so nothing needs to be installed to run them.
      - name: Byte-compile every module
        run: python -m compileall qwen_autopilot tests examples server.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run the offline demo end to end
        run: python examples/offline_demo.py
